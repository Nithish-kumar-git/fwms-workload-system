version: '3.8'

services:
  # ============================================================================
  # PostgreSQL Test Database
  # ============================================================================
  test_db:
    image: postgres:16
    container_name: faculty_selection_test_db
    environment:
      POSTGRES_DB: faculty_selection_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432" # Different port to avoid conflict with dev DB
    tmpfs:
      # Use tmpfs for faster test execution (in-memory database)
      - /var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 3s
      timeout: 2s
      retries: 5

  # ============================================================================
  # Test Runner
  # ============================================================================
  test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: faculty_selection_test
    depends_on:
      test_db:
        condition: service_healthy
    environment:
      # Test Database
      DATABASE_URL: postgresql://postgres:postgres@test_db:5432/faculty_selection_test

      # Environment
      ENV: test

      # Logging
      LOG_LEVEL: WARNING

      # Session (in-memory for tests)
      SESSION_BACKEND: memory

      # OAuth (mock for tests)
      GOOGLE_CLIENT_ID: test-client-id
      GOOGLE_CLIENT_SECRET: test-client-secret
      GOOGLE_REDIRECT_URI: http://localhost:8000/auth/callback

      # Security
      SECRET_KEY: test-secret-key-for-testing-purposes-only-32-chars-minimum

    volumes:
      # Mount source code and tests
      - ./app:/app/app
      - ./tests:/app/tests
      - ./migrations:/app/migrations
    command: >
      sh -c "
        echo 'Waiting for test database to be ready...' &&
        sleep 3 &&
        echo 'Running migrations on test DB...' &&
        for f in migrations/schema.sql migrations/002_window_lifecycle.sql migrations/003_seed_minimal.sql migrations/005_workload_schema.sql migrations/010_academic_cycle_support.sql migrations/016_semester_state_management.sql migrations/021_semester_specific_cycles.sql; do
          echo \"Running $$f...\" &&
          psql $$DATABASE_URL -f $$f || exit 1
        done &&
        echo 'Running pytest...' &&
        pytest tests/test_preservation_properties.py -v --tb=short --color=yes
      "
