version: '3.8'

services:
  # ============================================================================
  # PostgreSQL Database (Development)
  # ============================================================================
  db:
    image: postgres:16
    container_name: faculty_selection_db
    environment:
      POSTGRES_DB: faculty_selection
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================================
  # FastAPI Application (Development)
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: faculty_selection_app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Database
      DATABASE_URL: postgresql://postgres:postgres@db:5432/faculty_selection

      # Environment
      ENV: development

      # Logging
      LOG_LEVEL: INFO

      # Session (using in-memory for development)
      SESSION_BACKEND: memory

    ports:
      - "8000:8000"
    volumes:
      # Mount source code for hot reload in development
      - ./app:/app/app
      - ./migrations:/app/migrations
      - ./logs:/app/logs
    command: >
      sh -c "
        set -e &&
        echo 'Waiting for database to be ready...' &&
        sleep 5 &&
        echo '=== Running migrations (22 files) ===' &&
        echo '[1/22] schema.sql ...' &&
        psql $DATABASE_URL -f migrations/schema.sql &&
        echo '[2/22] 002_window_lifecycle.sql ...' &&
        psql $DATABASE_URL -f migrations/002_window_lifecycle.sql &&
        echo '[3/22] 003_seed_minimal.sql ...' &&
        psql $DATABASE_URL -f migrations/003_seed_minimal.sql &&
        echo '[4/22] 004_seed_demo.sql ...' &&
        psql $DATABASE_URL -f migrations/004_seed_demo.sql &&
        echo '[5/22] 005_workload_schema.sql ...' &&
        psql $DATABASE_URL -f migrations/005_workload_schema.sql &&
        echo '[6/22] 006_academic_seed.sql ...' &&
        psql $DATABASE_URL -f migrations/006_academic_seed.sql &&
        echo '[7/22] 007_faculty_seed.sql ...' &&
        psql $DATABASE_URL -f migrations/007_faculty_seed.sql &&
        echo '[8/22] 008_admin_override_schema.sql ...' &&
        psql $DATABASE_URL -f migrations/008_admin_override_schema.sql &&
        echo '[9/22] 009_window_audit_types.sql ...' &&
        psql $DATABASE_URL -f migrations/009_window_audit_types.sql &&
        echo '[10/22] 010_academic_cycle_support.sql ...' &&
        psql $DATABASE_URL -f migrations/010_academic_cycle_support.sql &&
        echo '[11/22] 011_update_staff_emails.sql ...' &&
        psql $DATABASE_URL -f migrations/011_update_staff_emails.sql &&
        echo '[12/22] 011b_workload_snapshot.sql ...' &&
        psql $DATABASE_URL -f migrations/011b_workload_snapshot.sql &&
        echo '[13/22] 012_fix_audit_constraint.sql ...' &&
        psql $DATABASE_URL -f migrations/012_fix_audit_constraint.sql &&
        echo '[14/22] 013_single_active_cycle.sql ...' &&
        psql $DATABASE_URL -f migrations/013_single_active_cycle.sql &&
        echo '[15/22] 014_fix_allocation_pipeline.sql ...' &&
        psql $DATABASE_URL -f migrations/014_fix_allocation_pipeline.sql &&
        echo '[16/22] 015_fix_preference_constraint.sql ...' &&
        psql $DATABASE_URL -f migrations/015_fix_preference_constraint.sql &&
        echo '[17/22] 016_semester_state_management.sql ...' &&
        psql $DATABASE_URL -f migrations/016_semester_state_management.sql &&
        echo '[18/22] 017_add_role_column.sql ...' &&
        psql $DATABASE_URL -f migrations/017_add_role_column.sql &&
        echo '[19/22] 019_final_fixed.sql ...' &&
        psql $DATABASE_URL -f migrations/019_final_fixed.sql &&
        echo '[20/22] 019_real_subjects_final.sql ...' &&
        psql $DATABASE_URL -f migrations/019_real_subjects_final.sql &&
        echo '[21/22] 020_real_faculty.sql ...' &&
        psql $DATABASE_URL -f migrations/020_real_faculty.sql &&
        echo '[22/22] 021_semester_specific_cycles.sql ...' &&
        psql $DATABASE_URL -f migrations/021_semester_specific_cycles.sql &&
        echo '=== All migrations complete ===' &&
        echo 'Starting FastAPI application...' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "
    healthcheck:
      test: [ "CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')\"" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  # Frontend runs locally: cd frontend && npm run dev

volumes:
  postgres_data:
    driver: local
